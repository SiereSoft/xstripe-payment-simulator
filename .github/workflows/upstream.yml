name: Upstream Stripe contract

# Weekly: is the pinned Stripe OpenAPI subset still what GitHub serves, and has Stripe changed the
# operations the simulator models since the last human review? Talks to GitHub only, never to
# Stripe's API. A failure is a prompt to review (see docs/COMPATIBILITY.md, "Upstream drift").
on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: Compare with stripe/openapi
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check the pinned contract and upstream drift
        run: python3 tools/check_upstream.py

      - name: Keep the latest upstream subset for review
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stripe-upstream-subset
          path: build/upstream/

name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Run tests (unit + unmodified stripe-java SDK)
        run: ./gradlew --no-daemon test

  sdk-python:
    name: stripe-python SDK e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Start the simulator
        run: |
          ./gradlew --no-daemon installDist
          FAKE_STRIPE_DATA=/tmp/state.json ./build/install/fake-stripe/bin/fake-stripe &
          for i in $(seq 1 30); do curl -sf http://localhost:12111/healthz && break; sleep 1; done

      - name: Run stripe-python suite
        run: |
          pip install -r sdk-tests/requirements.txt
          FAKE_STRIPE_BASE=http://localhost:12111 pytest sdk-tests -q
